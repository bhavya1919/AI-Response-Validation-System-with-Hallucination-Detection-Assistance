services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: veriai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: veriai
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - veriai_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veriai"]
      interval: 5s
      timeout: 5s
      retries: 10

  # backend:
